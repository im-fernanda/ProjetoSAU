<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Regional - Gerenciador SAU</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Header Institucional -->
<div th:replace="~{fragments/header :: header('Cadastro de Regional')}"></div>

<!-- Container Principal -->
<main class="container">
    <div class="content-card">
        <h1><i class="fas fa-plus-circle"></i> Cadastro de Regional</h1>
        
        <!-- Mensagem de alerta, se houver -->
        <div th:if="${msg}" class="alert alert-warning" role="alert">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${msg}"></span>
        </div>

        <form id="regionalForm" th:action="@{/processSaveRegional}" method="post" th:object="${regional}">
            <fieldset>
                <legend><i class="fas fa-info-circle"></i> Informações da Regional</legend>
                
                <label for="regional-nome"><i class="fas fa-map"></i> Nome da Regional <span style="color: red;">*</span></label>
                <input type="text" id="regional-nome" name="nome" th:field="*{nome}" 
                       required placeholder="Digite o nome da regional">
            </fieldset>

            <div style="margin-top: 2rem; display: flex; gap: 1rem; flex-wrap: wrap;">
                <button type="submit" name="action" value="save" class="btn">
                    <i class="fas fa-save"></i> Cadastrar e Permanecer
                </button>
                <button type="submit" name="action" value="goToComarca" class="btn btn-success">
                    <i class="fas fa-arrow-right"></i> Cadastrar e Ir para Comarcas
                </button>
                <a href="/listarLocais" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
