<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transferir Equipamento - Gerenciador SAU</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Header Institucional -->
<div th:replace="~{fragments/header :: header('Transferir Equipamento')}"></div>

<!-- Container Principal -->
<main class="container">
    <div class="content-card" th:if="${equipamento}">
        <h1><i class="fas fa-exchange-alt"></i> Transferir Equipamento</h1>
        
        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
        </div>

        <fieldset style="margin-bottom: 1.5rem; background: var(--mp-light);">
            <legend><i class="fas fa-info-circle"></i> Equipamento a Transferir</legend>
            
            <table style="width: 100%; border: none;">
                <tbody>
                    <tr>
                        <td style="width: 200px; font-weight: bold; padding: 0.5rem 0;"><i class="fas fa-barcode"></i> Tombo:</td>
                        <td style="padding: 0.5rem 0;" th:text="${equipamento.tombo}">-</td>
                    </tr>
                    <tr>
                        <td style="font-weight: bold; padding: 0.5rem 0;"><i class="fas fa-tag"></i> Nome:</td>
                        <td style="padding: 0.5rem 0;" th:text="${equipamento.nome}">-</td>
                    </tr>
                    <tr>
                        <td style="font-weight: bold; padding: 0.5rem 0;"><i class="fas fa-building"></i> Unidade Atual:</td>
                        <td style="padding: 0.5rem 0;" th:text="${equipamento.unidade.nome}">-</td>
                    </tr>
                    <tr>
                        <td style="font-weight: bold; padding: 0.5rem 0;"><i class="fas fa-map-marker-alt"></i> Localização:</td>
                        <td style="padding: 0.5rem 0;">
                            <span th:text="${equipamento.unidade.comarca.nome}"></span> - 
                            <span th:text="${equipamento.unidade.comarca.regional.nome}"></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </fieldset>

        <form id="transferenciaForm" th:action="@{/processTransferencia}" method="post">
            <input type="hidden" name="equipamentoId" th:value="${equipamento.id}"/>

            <fieldset>
                <legend><i class="fas fa-map-marker-alt"></i> Selecionar Nova Unidade</legend>

                <label for="novaUnidadeId"><i class="fas fa-building"></i> Nova Unidade de Destino <span style="color: red;">*</span></label>
                <select id="novaUnidadeId" name="novaUnidadeId" required>
                    <option value="">Selecione a unidade de destino...</option>
                    <option th:each="unidade : ${unidades}"
                            th:value="${unidade.id}"
                            th:data-nome="${unidade.nome}"
                            th:data-comarca="${unidade.comarca.nome}"
                            th:data-regional="${unidade.comarca.regional.nome}"
                            th:text="${unidade.nome + ' - ' + unidade.comarca.nome + ' (' + unidade.comarca.regional.nome + ')'}"
                            th:disabled="${unidade.id == equipamento.unidade.id}">
                    </option>
                </select>

                <div class="alert alert-warning" style="margin-top: 1rem;">
                    <i class="fas fa-exclamation-triangle"></i> 
                    <strong>Atenção:</strong> Esta ação transferirá o equipamento para a unidade selecionada. 
                    A unidade atual não poderá ser selecionada.
                </div>
            </fieldset>

            <div style="margin-top: 2rem; display: flex; gap: 1rem; flex-wrap: wrap;">
                <button type="submit" class="btn btn-secondary" id="btnConfirmar">
                    <i class="fas fa-exchange-alt"></i> Confirmar Transferência
                </button>
                <a th:href="@{/listarEquipamentos}" class="btn">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script th:inline="javascript">
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('transferenciaForm');
    const selectUnidade = document.getElementById('novaUnidadeId');
    
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const unidadeId = selectUnidade.value;
        
        if (!unidadeId) {
            alert('Por favor, selecione uma unidade de destino antes de confirmar a transferência.');
            return;
        }
        
        // Obtém informações da unidade selecionada
        const unidadeSelecionada = selectUnidade.options[selectUnidade.selectedIndex];
        const textoCompleto = unidadeSelecionada.text;
        const partes = textoCompleto.split(' - ');
        const nomeUnidadeDestino = partes[0];
        const localizacaoDestino = partes[1] || '';
        
        // Usa valores do Thymeleaf para obter informações do equipamento
        const tombo = /*[[${equipamento.tombo}]]*/ '';
        const nome = /*[[${equipamento.nome}]]*/ '';
        const unidadeAtual = /*[[${equipamento.unidade.nome}]]*/ '';
        const comarcaAtual = /*[[${equipamento.unidade.comarca.nome}]]*/ '';
        const regionalAtual = /*[[${equipamento.unidade.comarca.regional.nome}]]*/ '';
        const localizacaoAtual = comarcaAtual + ' - ' + regionalAtual;
        
        // Cria mensagem de confirmação formatada
        const mensagem = 
            '╔═══════════════════════════════════════════════╗\n' +
            '║  CONFIRMAÇÃO DE TRANSFERÊNCIA DE EQUIPAMENTO  ║\n' +
            '╚═══════════════════════════════════════════════╝\n\n' +
            '📦 EQUIPAMENTO:\n' +
            '   • Tombo: ' + tombo + '\n' +
            '   • Nome: ' + nome + '\n\n' +
            '📍 DE (Unidade Atual):\n' +
            '   • Unidade: ' + unidadeAtual + '\n' +
            '   • Localização: ' + localizacaoAtual + '\n\n' +
            '🎯 PARA (Nova Unidade):\n' +
            '   • Unidade: ' + nomeUnidadeDestino + '\n' +
            '   • Localização: ' + localizacaoDestino + '\n\n' +
            '⚠️ Esta ação não pode ser desfeita automaticamente.\n\n' +
            'Deseja confirmar a transferência?';
        
        if (confirm(mensagem)) {
            form.submit();
        }
    });
});
</script>

</body>
</html>
