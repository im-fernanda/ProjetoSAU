<!-- Fragment Header Institucional -->
<header class="mp-header" th:fragment="header(title)">
  <div class="mp-header-content">
    <div class="mp-logo-container">
      <img
        id="logo-img"
        src="/images/logo-mprn.png"
        th:src="@{/images/logo-mprn.png}"
        alt="Logo Ministério Público"
        class="mp-logo"
        onerror="this.style.display='none'; const fallback = document.getElementById('logo-fallback'); if (fallback) fallback.style.display='block';"
      />
      <div id="logo-fallback" style="display: none">
        <div class="mp-header-title">
          <h1>Ministério Público</h1>
          <span class="subtitle">Gerenciador de Equipamentos</span>
        </div>
      </div>
      <div class="mp-logo-text" id="mp-logo-text">
        <div class="mp-logo-text-line1">Ministério Público</div>
        <div class="mp-logo-text-line2">do Rio Grande do Norte</div>
      </div>
    </div>
    <div class="mp-header-title">
      <h1 th:text="${title}">Gerenciador SAU</h1>
      <span class="subtitle">Sistema de Atendimento ao Usuário</span>
    </div>
    <nav class="mp-nav">
      <a href="/" class="mp-nav-link"><i class="fas fa-home"></i> Início</a>
      <a href="/listarEquipamentos" class="mp-nav-link"
        ><i class="fas fa-laptop"></i> Equipamentos</a
      >
      <a href="/listarLocais" class="mp-nav-link"
        ><i class="fas fa-map-marker-alt"></i> Locais</a
      >
    </nav>
  </div>
</header>
