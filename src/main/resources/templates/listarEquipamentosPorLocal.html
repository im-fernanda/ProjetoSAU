<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipamentos da Unidade - Gerenciador SAU</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Header Institucional -->
<div th:replace="~{fragments/header :: header('Equipamentos da Unidade')}"></div>

<!-- Container Principal -->
<main class="container">
    <div class="content-card">
        <div style="margin-bottom: 1.5rem;">
            <a href="/listarLocais" class="btn btn-secondary" style="margin-bottom: 1rem;">
                <i class="fas fa-arrow-left"></i> Voltar para Locais
            </a>
        </div>

        <h1><i class="fas fa-building"></i> Equipamentos da Unidade</h1>
        <h3 th:if="${unidade}">
            <strong>Unidade:</strong> <span th:text="${unidade.nome}"></span><br>
            <span style="font-size: 0.9em; color: var(--mp-gray);">
                <strong>Comarca:</strong> <span th:text="${unidade.comarca.nome}"></span> | 
                <strong>Regional:</strong> <span th:text="${unidade.comarca.regional.nome}"></span>
            </span>
        </h3>

        <div th:if="${equipamentos != null && !equipamentos.empty}">
            <fieldset>
                <legend><i class="fas fa-list"></i> Equipamentos Cadastrados</legend>
                
                <table>
                    <thead>
                        <tr>
                            <th><i class="fas fa-barcode"></i> Tombo</th>
                            <th><i class="fas fa-tag"></i> Nome</th>
                            <th><i class="fas fa-cog"></i> Modelo</th>
                            <th><i class="fas fa-align-left"></i> Descrição</th>
                            <th><i class="fas fa-tools"></i> Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="equipamento : ${equipamentos}">
                            <td th:text="${equipamento.tombo}">Tombo</td>
                            <td th:text="${equipamento.nome}">Nome</td>
                            <td th:text="${equipamento.modelo}">Modelo</td>
                            <td th:text="${equipamento.descricao}">Descrição</td>
                            <td>
                                <div class="action-btns">
                                    <a th:href="@{/editarEquipamento/{id}(id=${equipamento.id})}" 
                                       class="action-btn" 
                                       title="Editar Equipamento">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a th:href="@{/cadastrarTransferencia/{id}(id=${equipamento.id})}" 
                                       class="action-btn" 
                                       title="Transferir Equipamento"
                                       style="color: var(--mp-secondary);">
                                        <i class="fas fa-exchange-alt"></i>
                                    </a>
                                    <a th:href="@{/deletarEquipamento/{id}(id=${equipamento.id})}" 
                                       class="action-btn" 
                                       title="Excluir Equipamento"
                                       onclick="return confirm('Tem certeza que deseja excluir este equipamento?');">
                                        <i class="fas fa-trash-alt"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
                
                <div style="margin-top: 1rem; padding: 1rem; background: var(--mp-light); border-radius: 4px;">
                    <strong><i class="fas fa-info-circle"></i> Total de equipamentos:</strong> 
                    <span th:text="${#lists.size(equipamentos)}">0</span>
                </div>
            </fieldset>
        </div>
        
        <div th:if="${equipamentos == null || equipamentos.empty}" class="alert alert-info">
            <i class="fas fa-info-circle"></i> Esta unidade não possui equipamentos cadastrados.
        </div>

        <div style="margin-top: 2rem;">
            <a th:href="@{/cadastroEquipamento}" class="btn">
                <i class="fas fa-plus"></i> Cadastrar Novo Equipamento nesta Unidade
            </a>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
