<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado da Busca - Gerenciador SAU</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Header Institucional -->
<div th:replace="~{fragments/header :: header('Resultado da Busca')}"></div>

<!-- Container Principal -->
<main class="container">
    <div class="content-card">
        <div style="margin-bottom: 1.5rem;">
            <a href="/listarPorNome" class="btn btn-secondary" style="margin-bottom: 1rem;">
                <i class="fas fa-arrow-left"></i> Nova Busca
            </a>
        </div>

        <h1><i class="fas fa-search"></i> Resultado da Busca</h1>
        <h3 th:if="${nomeBusca}">
            Buscando por: "<strong th:text="${nomeBusca}"></strong>"
        </h3>

        <div th:if="${equipamentos != null && !equipamentos.empty}">
            <div class="alert alert-info" style="margin-bottom: 1.5rem;">
                <i class="fas fa-info-circle"></i> 
                <strong th:text="${#lists.size(equipamentos)}">0</strong> equipamento(s) encontrado(s).
            </div>

            <fieldset>
                <legend><i class="fas fa-list"></i> Equipamentos Encontrados</legend>
                
                <table>
                    <thead>
                        <tr>
                            <th><i class="fas fa-barcode"></i> Tombo</th>
                            <th><i class="fas fa-tag"></i> Nome</th>
                            <th><i class="fas fa-cog"></i> Modelo</th>
                            <th><i class="fas fa-align-left"></i> Descrição</th>
                            <th><i class="fas fa-building"></i> Unidade</th>
                            <th><i class="fas fa-tools"></i> Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="equipamento : ${equipamentos}">
                            <td>
                                <a th:href="@{/listarPorTombo/{tombo}(tombo=${equipamento.tombo})}" 
                                   style="color: var(--mp-primary); text-decoration: none;"
                                   th:text="${equipamento.tombo}">Tombo</a>
                            </td>
                            <td th:text="${equipamento.nome}">Nome</td>
                            <td th:text="${equipamento.modelo}">Modelo</td>
                            <td th:text="${equipamento.descricao}">Descrição</td>
                            <td>
                                <a th:href="@{/listarPorLocal/{id}(id=${equipamento.unidade.id})}" 
                                   style="color: var(--mp-primary); text-decoration: none;"
                                   th:text="${equipamento.unidade.nome}">Unidade</a>
                            </td>
                            <td>
                                <div class="action-btns">
                                    <a th:href="@{/editarEquipamento/{id}(id=${equipamento.id})}" 
                                       class="action-btn" 
                                       title="Editar Equipamento">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <a th:href="@{/listarPorTombo/{tombo}(tombo=${equipamento.tombo})}" 
                                       class="action-btn" 
                                       title="Ver Detalhes"
                                       style="color: var(--mp-secondary);">
                                        <i class="fas fa-info-circle"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </fieldset>
        </div>
        
        <div th:if="${equipamentos == null || equipamentos.empty}" class="alert alert-warning">
            <i class="fas fa-exclamation-triangle"></i> Nenhum equipamento encontrado com o nome "<strong th:text="${nomeBusca}"></strong>".
            <div style="margin-top: 1rem;">
                <a href="/listarPorNome" class="btn btn-secondary">
                    <i class="fas fa-search"></i> Tentar Nova Busca
                </a>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
